services:
  - type: web
    name: estudionoe-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://mvisions.github.io
      - key: RANKING_STORAGE
        value: github
      - key: GITHUB_REPOSITORY
        value: mvisions/estudionoe
      - key: GITHUB_DATA_BRANCH
        value: ranking-data
      - key: GITHUB_TOKEN
        sync: false
      - key: VISITOR_FIRESTORE_PROJECT_ID
        sync: false
      - key: VISITOR_FIRESTORE_CREDENTIALS_JSON
        sync: false
      - key: VISITOR_ADMIN_PIN
        sync: false
